<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IoT Camera Dashboard</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- LOGIN PAGE -->
  <div id="login-page" class="page">
    <div class="login-box">
      <h1>IoT Camera Dashboard</h1>
      <p class="login-sub">Sign in to view your cameras</p>
      <div class="form-group">
        <input type="text" id="username" placeholder="Username"/>
      </div>
      <div class="form-group">
        <input type="password" id="password" placeholder="Password"/>
      </div>
      <button id="login-btn" onclick="login()">Login</button>
      <button id="register-btn" onclick="register()">Register</button>
      <p id="login-error" class="error"></p>
    </div>
  </div>

  <!-- DASHBOARD PAGE -->
  <div id="dashboard-page" class="page hidden">

    <!-- Header -->
    <header>
      <div class="header-left">
        <h2>IoT Camera Dashboard</h2>
      </div>
      <div class="header-right">
        <span id="header-user"></span>
        <button onclick="logout()">Logout</button>
      </div>
    </header>

    <main>

      <!-- Camera Cards -->
      <section>
        <h3>Cameras</h3>
        <div id="camera-cards" class="cards-row"></div>
      </section>

      <!-- Live Event Feed -->
      <section>
        <h3>Live Events <span class="live-dot"></span></h3>
        <div id="event-feed" class="event-feed"></div>
      </section>

      <!-- Image Gallery -->
      <section>
        <h3>Image Gallery</h3>
        <div id="cam-tabs" class="tabs"></div>
        <div id="image-gallery" class="gallery"></div>
      </section>

      <!-- DynamoDB Records -->
      <section>
        <h3>All Records</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Camera</th>
                <th>Timestamp</th>
                <th>Image URL</th>
                <th>Bucket</th>
              </tr>
            </thead>
            <tbody id="events-table"></tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
